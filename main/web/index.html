<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Plant watering</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203b32; background: #f3f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; display: grid; place-items: center; }
    main { width: 100%; max-width: 580px; }
    .brand { margin: 0 0 28px; font-size: 13px; font-weight: 700; letter-spacing: .16em; }
    .brand span { color: #65756b; font-weight: 400; letter-spacing: 0; margin-left: 12px; }
    .card { padding: 36px; background: #fff; border: 1px solid #dce3d8; border-radius: 24px; box-shadow: 0 16px 48px #223e3010; }
    .eyebrow { margin: 0 0 12px; color: #65756b; text-transform: uppercase; font-size: 12px; font-weight: 650; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); font-weight: 600; letter-spacing: -.04em; }
    .reading { display: flex; align-items: baseline; gap: 8px; margin: 30px 0 20px; font-variant-numeric: tabular-nums; }
    #humidity { font-size: clamp(70px, 17vw, 104px); font-weight: 550; letter-spacing: -.07em; line-height: 1; }
    .unit { color: #65756b; font-size: 30px; }
    .track { height: 10px; background: #e8eee3; border-radius: 10px; overflow: hidden; }
    .fill { width: 0; height: 100%; background: #456b4c; transition: width .35s ease; }
    .meta { margin: 16px 0 0; font-size: 14px; color: #65756b; min-height: 42px; line-height: 1.5; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
    button { min-height: 50px; padding: 14px 18px; border-radius: 12px; border: 1px solid #dce3d8; background: #fff; color: #203b32; font: inherit; font-size: 13px; font-weight: 650; letter-spacing: .07em; cursor: pointer; }
    button.primary { color: #fff; background: #294f3c; border-color: #294f3c; }
    button:hover:not(:disabled) { background: #edf2e8; }
    button.primary:hover:not(:disabled) { background: #1d402f; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid #71874c; outline-offset: 4px; }
    .message { margin: 18px 0 0; min-height: 42px; font-size: 14px; line-height: 1.5; }
    .error { color: #a4352a; }
    .footnote { margin: 20px 4px 0; color: #65756b; font-size: 13px; line-height: 1.6; }
    @media (max-width: 420px) { body { padding: 28px 16px; } .card { padding: 26px 22px; } .brand span { display: block; margin: 6px 0 0; } }
    @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">ESP32 SMART WATERING <span>Watering controller</span></p>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Overview</p>
      <h1 id="page-title">Soil humidity</h1>
      <div class="reading" aria-live="polite" aria-atomic="true"><span id="humidity">—</span><span class="unit">%</span></div>
      <div class="track" aria-hidden="true"><div class="fill" id="humidity-fill"></div></div>
      <p class="meta" id="reading-status" role="status">Connecting to your plant…</p>
      <div class="actions">
        <button class="primary" id="water-button" type="button" disabled>WATER NOW</button>
        <button id="config-button" type="button">CONFIG</button>
      </div>
      <p class="message" id="action-status" role="status"></p>
      <noscript><p class="error">Enable JavaScript to view humidity and use the controls.</p></noscript>
    </section>
    <p class="footnote">Humidity refreshes automatically. Manual watering uses the amount saved in CONFIG.</p>
  </main>
  <script>
    // API: GET /api/status -> { humidity_pct: number, watering: boolean }
    // API: POST /api/water -> 2xx when the watering request is accepted.
    const humidity = document.querySelector('#humidity');
    const humidityFill = document.querySelector('#humidity-fill');
    const readingStatus = document.querySelector('#reading-status');
    const actionStatus = document.querySelector('#action-status');
    const waterButton = document.querySelector('#water-button');
    let statusAvailable = false;
    let watering = false;
    let requestPending = false;
    let lastUpdate = null;
    let refreshTimer;
    let statusRequest = null;

    document.querySelector('#config-button').addEventListener('click', () => {
      window.location.assign('/config');
    });

    function updateButton() {
      waterButton.disabled = !statusAvailable || requestPending || watering;
      waterButton.textContent = requestPending ? 'SENDING…' : watering ? 'WATERING…' : 'WATER NOW';
    }

    async function request(url, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);
      try {
        const response = await fetch(url, { ...options, cache: 'no-store', signal: controller.signal });
        const data = response.ok && !options.method ? await response.json() : null;
        return { ok: response.ok, status: response.status, data };
      } finally {
        clearTimeout(timeout);
      }
    }

    function refreshStatus() {
      if (statusRequest) return statusRequest;
      clearTimeout(refreshTimer);
      statusRequest = (async () => {
        try {
          const response = await request('/api/status');
          if (!response.ok) throw new Error('Status unavailable');
          const data = response.data;
          if (!Number.isFinite(data.humidity_pct) || data.humidity_pct < 0 || data.humidity_pct > 100 || typeof data.watering !== 'boolean') {
            throw new Error('Invalid status');
          }
          lastUpdate = new Date();
          statusAvailable = true;
          watering = data.watering;
          humidity.textContent = data.humidity_pct.toFixed(1);
          humidityFill.style.width = `${data.humidity_pct}%`;
          readingStatus.classList.remove('error');
          readingStatus.textContent = `${watering ? 'Watering in progress' : 'Updated'} · ${lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        } catch (error) {
          statusAvailable = false;
          humidity.textContent = '—';
          humidityFill.style.width = '0%';
          readingStatus.classList.add('error');
          readingStatus.textContent = lastUpdate
            ? `Connection lost. Last update: ${lastUpdate.toLocaleTimeString()}. Retrying…`
            : 'Unable to read humidity. Retrying…';
        } finally {
          updateButton();
        }
      })().finally(() => {
        statusRequest = null;
        refreshTimer = setTimeout(refreshStatus, 5000);
      });
      return statusRequest;
    }

    waterButton.addEventListener('click', async () => {
      if (requestPending || watering || !statusAvailable) return;
      requestPending = true;
      updateButton();
      actionStatus.classList.remove('error');
      actionStatus.textContent = 'Sending watering request…';
      try {
        const response = await request('/api/water', { method: 'POST' });
        if (!response.ok) {
          actionStatus.classList.add('error');
          actionStatus.textContent = response.status === 409
            ? 'Watering is already running or temporarily unavailable.'
            : `The controller rejected the request (HTTP ${response.status}).`;
        } else {
          actionStatus.textContent = 'Watering request accepted.';
        }
      } catch (error) {
        actionStatus.classList.add('error');
        actionStatus.textContent = 'No confirmation received. Check the plant’s status before trying again.';
      } finally {
        // Finish an older poll before requesting the current watering state.
        if (statusRequest) await statusRequest;
        await refreshStatus();
        requestPending = false;
        updateButton();
      }
    });

    refreshStatus();
  </script>
</body>
</html>
